<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Portal</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 flex items-center justify-center p-6">

    <!-- Main Container -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl p-8">

        <!-- Heading -->
        <div class="text-center mb-6">

            <h1 class="text-3xl font-bold text-blue-700">
                Student Registration
            </h1>

            <p class="text-gray-500 mt-2">
                College Admission Portal
            </p>

        </div>


        <!-- Registration Form -->
        <form id="registrationForm" novalidate>

            <!-- Full Name -->
            <div class="mb-4">

                <label
                    for="name"
                    class="block text-gray-700 font-semibold mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p
                    id="nameError"
                    class="text-red-500 text-sm mt-1">
                </p>

            </div>


            <!-- Email -->
            <div class="mb-4">

                <label
                    for="email"
                    class="block text-gray-700 font-semibold mb-2">
                    Email Address
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="example@gmail.com"
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p
                    id="emailError"
                    class="text-red-500 text-sm mt-1">
                </p>

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label
                    for="password"
                    class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters"
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <!-- Show / Hide Password -->
                <button
                    type="button"
                    id="togglePassword"
                    class="text-blue-600 text-sm mt-2 hover:underline">

                    Show password

                </button>

                <p
                    id="passwordError"
                    class="text-red-500 text-sm mt-1">
                </p>

            </div>


            <!-- Mobile Number -->
            <div class="mb-4">

                <label
                    for="mobile"
                    class="block text-gray-700 font-semibold mb-2">
                    Mobile Number
                </label>

                <input
                    type="text"
                    id="mobile"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p
                    id="mobileError"
                    class="text-red-500 text-sm mt-1">
                </p>

            </div>


            <!-- Course -->
            <div class="mb-6">

                <label
                    for="course"
                    class="block text-gray-700 font-semibold mb-2">
                    Select Course
                </label>

                <select
                    id="course"
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <option value="">
                        -- Select Course --
                    </option>

                    <option value="B.Tech">
                        B.Tech
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="BBA">
                        BBA
                    </option>

                    <option value="B.Sc">
                        B.Sc
                    </option>

                </select>

                <p
                    id="courseError"
                    class="text-red-500 text-sm mt-1">
                </p>

            </div>


            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-300">

                Register Now

            </button>


            <!-- Success Message -->
            <p
                id="successMessage"
                class="text-green-600 text-center font-semibold mt-4">
            </p>

        </form>

    </div>


    <!-- JavaScript -->
    <script>

        // ==============================
        // SHOW / HIDE PASSWORD
        // ==============================

        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";
                togglePassword.textContent = "Hide password";

            } else {

                password.type = "password";
                togglePassword.textContent = "Show password";

            }

        });


        // ==============================
        // FORM VALIDATION
        // ==============================

        const form = document.getElementById("registrationForm");

        form.addEventListener("submit", function (event) {

            event.preventDefault();


            // Get values
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const passwordValue = document.getElementById("password").value;
            const mobile = document.getElementById("mobile").value.trim();
            const course = document.getElementById("course").value;


            // Error elements
            const nameError = document.getElementById("nameError");
            const emailError = document.getElementById("emailError");
            const passwordError = document.getElementById("passwordError");
            const mobileError = document.getElementById("mobileError");
            const courseError = document.getElementById("courseError");
            const successMessage = document.getElementById("successMessage");


            // Clear previous errors
            nameError.textContent = "";
            emailError.textContent = "";
            passwordError.textContent = "";
            mobileError.textContent = "";
            courseError.textContent = "";
            successMessage.textContent = "";


            let isValid = true;


            // ==============================
            // NAME VALIDATION
            // ==============================

            if (name === "") {

                nameError.textContent = "Full name is required.";

                isValid = false;

            }


            // ==============================
            // EMAIL VALIDATION
            // ==============================

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {

                emailError.textContent = "Email is required.";

                isValid = false;

            }
            else if (!emailPattern.test(email)) {

                emailError.textContent = "Enter a valid email address.";

                isValid = false;

            }


            // ==============================
            // PASSWORD VALIDATION
            // ==============================

            if (passwordValue === "") {

                passwordError.textContent = "Password is required.";

                isValid = false;

            }
            else if (passwordValue.length < 8) {

                passwordError.textContent =
                    "Password must be at least 8 characters.";

                isValid = false;

            }


            // ==============================
            // MOBILE VALIDATION
            // ==============================

            const mobilePattern = /^[0-9]{10}$/;

            if (mobile === "") {

                mobileError.textContent =
                    "Mobile number is required.";

                isValid = false;

            }
            else if (!mobilePattern.test(mobile)) {

                mobileError.textContent =
                    "Mobile number must contain exactly 10 digits.";

                isValid = false;

            }


            // ==============================
            // COURSE VALIDATION
            // ==============================

            if (course === "") {

                courseError.textContent =
                    "Please select a course.";

                isValid = false;

            }


            // ==============================
            // SUCCESS
            // ==============================

            if (isValid) {

                successMessage.textContent =
                    "Registration successful!";

                form.reset();

                // Reset password toggle
                password.type = "password";
                togglePassword.textContent = "Show password";

            }

        });

    </script>

</body>

</html>
